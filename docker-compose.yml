services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: my-ai-cv-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - frontend-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-ai-cv-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8095"
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE:-myaicv}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-myaicv}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-myaicv_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
    networks:
      - frontend-net
      - backend-net

  db:
    image: mysql:8.4
    container_name: my-ai-cv-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myaicv}
      MYSQL_USER: ${DB_USERNAME:-myaicv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-myaicv_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-myaicv_root_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-net

networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  mysql-data:
